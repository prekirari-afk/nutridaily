<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NutriDaily - AI食事・栄養管理</title>
  
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NutriDaily">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-28 md:pb-12 antialiased selection:bg-emerald-500 selection:text-white">

  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center shadow-xs">
          <i class="fa-solid fa-apple-whole text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-extrabold text-base tracking-tight text-slate-800">NutriDaily</h1>
            <span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-100 text-emerald-800 uppercase">AI Live</span>
          </div>
          <p class="text-[10px] text-slate-400 font-medium leading-none">Smart Nutrition Tracker</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openSettingsModal()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition text-xs font-bold border border-slate-200 flex items-center gap-1.5">
          <i class="fa-solid fa-sliders"></i>
          <span>設定</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-4 space-y-4">
    <!-- 日付ナビゲーション -->
    <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-xs flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5">
        <button onclick="shiftDate(-1)" class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center"><i class="fa-solid fa-chevron-left text-xs"></i></button>
        <input type="date" id="date-picker-input" onchange="onDateInputChange(this.value)" class="text-xs sm:text-sm font-bold bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 focus:outline-none">
        <button onclick="shiftDate(1)" class="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center"><i class="fa-solid fa-chevron-right text-xs"></i></button>
        <button onclick="goToToday()" class="px-2.5 py-1.5 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">今日</button>
      </div>
      <button onclick="openMealModal()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs">
        <i class="fa-solid fa-plus text-xs"></i><span>食事を記録</span>
      </button>
    </div>

    <!-- カロリー & PFC -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-400 uppercase">摂取カロリー</span>
          <span id="stat-calorie-status" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700">目標内</span>
        </div>
        <div class="flex items-baseline gap-2 mb-2">
          <span id="stat-total-calories" class="text-3xl font-extrabold text-slate-900">0</span>
          <span class="text-xs text-slate-400">/ <span id="stat-target-calories">2000</span> kcal</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden mb-2">
          <div id="stat-calorie-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <div class="text-[11px] text-slate-500 flex justify-between">
          <span>残り: <strong id="stat-remaining-calories" class="text-slate-800">2000</strong> kcal</span>
          <span id="stat-calorie-percent" class="font-bold">0%</span>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs space-y-2">
        <span class="text-xs font-bold text-slate-400 uppercase block">PFC バランス (現在 / 目標)</span>
        <div>
          <div class="flex justify-between text-xs font-bold text-rose-600 mb-0.5"><span>たんぱく質 (P)</span><span><span id="stat-p-val">0</span>g / <span id="stat-p-target">110</span>g</span></div>
          <div class="w-full bg-slate-100 rounded-full h-1.5"><div id="stat-p-bar" class="h-full bg-rose-500 rounded-full" style="width: 0%"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-xs font-bold text-amber-600 mb-0.5"><span>脂質 (F)</span><span><span id="stat-f-val">0</span>g / <span id="stat-f-target">50</span>g</span></div>
          <div class="w-full bg-slate-100 rounded-full h-1.5"><div id="stat-f-bar" class="h-full bg-amber-500 rounded-full" style="width: 0%"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-xs font-bold text-sky-600 mb-0.5"><span>炭水化物 (C)</span><span><span id="stat-c-val">0</span>g / <span id="stat-c-target">275</span>g</span></div>
          <div class="w-full bg-slate-100 rounded-full h-1.5"><div id="stat-c-bar" class="h-full bg-sky-500 rounded-full" style="width: 0%"></div></div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-400 uppercase">水分摂取量</span>
          <div class="flex gap-1">
            <button onclick="addWater(200)" class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold">+200ml</button>
            <button onclick="addWater(500)" class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold">+500ml</button>
          </div>
        </div>
        <div class="flex items-baseline gap-2 my-2">
          <span id="stat-water-val" class="text-3xl font-extrabold text-blue-600">0</span>
          <span class="text-xs text-slate-400">/ 2000 ml</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden"><div id="stat-water-bar" class="h-full bg-blue-500 rounded-full" style="width: 0%"></div></div>
      </div>
    </div>

    <!-- 食事リスト -->
    <div class="space-y-3">
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
        <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span><h3 class="font-bold text-sm">朝食</h3><span id="badge-breakfast-subtotal" class="text-xs text-slate-500 font-semibold">(0 kcal)</span></div>
          <button onclick="openMealModal('breakfast')" class="text-xs font-bold text-emerald-600"><i class="fa-solid fa-plus"></i> 追加</button>
        </div>
        <div id="meal-list-breakfast" class="divide-y divide-slate-100 p-2"><div class="text-center py-4 text-xs text-slate-400">記録なし</div></div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
        <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span><h3 class="font-bold text-sm">昼食</h3><span id="badge-lunch-subtotal" class="text-xs text-slate-500 font-semibold">(0 kcal)</span></div>
          <button onclick="openMealModal('lunch')" class="text-xs font-bold text-emerald-600"><i class="fa-solid fa-plus"></i> 追加</button>
        </div>
        <div id="meal-list-lunch" class="divide-y divide-slate-100 p-2"><div class="text-center py-4 text-xs text-slate-400">記録なし</div></div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
        <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span><h3 class="font-bold text-sm">夕食</h3><span id="badge-dinner-subtotal" class="text-xs text-slate-500 font-semibold">(0 kcal)</span></div>
          <button onclick="openMealModal('dinner')" class="text-xs font-bold text-emerald-600"><i class="fa-solid fa-plus"></i> 追加</button>
        </div>
        <div id="meal-list-dinner" class="divide-y divide-slate-100 p-2"><div class="text-center py-4 text-xs text-slate-400">記録なし</div></div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
        <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span><h3 class="font-bold text-sm">間食</h3><span id="badge-snack-subtotal" class="text-xs text-slate-500 font-semibold">(0 kcal)</span></div>
          <button onclick="openMealModal('snack')" class="text-xs font-bold text-emerald-600"><i class="fa-solid fa-plus"></i> 追加</button>
        </div>
        <div id="meal-list-snack" class="divide-y divide-slate-100 p-2"><div class="text-center py-4 text-xs text-slate-400">記録なし</div></div>
      </div>
    </div>
  </main>

  <!-- 食事モーダル -->
  <div id="meal-modal" class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-3 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-base">食事を記録</h3>
        <button onclick="closeMealModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="saveMealForm(event)" class="space-y-3">
        <input type="hidden" id="meal-category-val" value="lunch">
        <div class="grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold text-slate-600">
          <button type="button" onclick="selectMealFormCat('breakfast')" id="cat-btn-breakfast" class="py-1 rounded-lg">朝食</button>
          <button type="button" onclick="selectMealFormCat('lunch')" id="cat-btn-lunch" class="py-1 rounded-lg">昼食</button>
          <button type="button" onclick="selectMealFormCat('dinner')" id="cat-btn-dinner" class="py-1 rounded-lg">夕食</button>
          <button type="button" onclick="selectMealFormCat('snack')" id="cat-btn-snack" class="py-1 rounded-lg">間食</button>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-bold text-slate-600">料理・食品名</label>
            <button type="button" onclick="triggerAiAutoEstimate()" class="text-xs font-bold text-indigo-600 flex items-center gap-1"><i class="fa-solid fa-wand-magic-sparkles"></i> AI自動入力</button>
          </div>
          <input type="text" id="meal-name-input" required placeholder="例: そば、豚汁定食" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <div id="ai-estimate-hint" class="hidden text-xs text-slate-500 mt-1"></div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">エネルギー (kcal)</label>
          <input type="number" step="1" id="meal-cal-input" required placeholder="450" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div><label class="block text-xs font-bold text-rose-600 mb-1">P (g)</label><input type="number" step="0.1" id="meal-p-input" class="w-full px-2 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div>
          <div><label class="block text-xs font-bold text-amber-600 mb-1">F (g)</label><input type="number" step="0.1" id="meal-f-input" class="w-full px-2 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div>
          <div><label class="block text-xs font-bold text-sky-600 mb-1">C (g)</label><input type="number" step="0.1" id="meal-c-input" class="w-full px-2 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div>
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeMealModal()" class="px-4 py-2 text-xs font-bold text-slate-500">キャンセル</button>
          <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-3 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-base">設定</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="saveTargetSettings(event)" class="space-y-3">
        <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-xl space-y-1">
          <label class="block text-xs font-bold text-indigo-900 flex items-center gap-1"><i class="fa-solid fa-key"></i> Gemini APIキー</label>
          <input type="text" id="set-api-key" placeholder="AQ.A... または AIza..." class="w-full px-3 py-2 text-xs bg-white border border-indigo-200 rounded-xl focus:outline-none">
          <p class="text-[10px] text-indigo-600">※このブラウザ内にのみ保存されます。</p>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">目標カロリー (kcal)</label>
          <input type="number" step="10" id="set-target-cal" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div><label class="block text-xs font-bold text-rose-600 mb-1">目標 P(g)</label><input type="number" step="1" id="set-target-p" required class="w-full px-2 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div>
          <div><label class="block text-xs font-bold text-amber-600 mb-1">目標 F(g)</label><input type="number" step="1" id="set-target-f" required class="w-full px-2 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div>
          <div><label class="block text-xs font-bold text-sky-600 mb-1">目標 C(g)</label><input type="number" step="1" id="set-target-c" required class="w-full px-2 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl"></div>
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeSettingsModal()" class="px-4 py-2 text-xs font-bold text-slate-500">キャンセル</button>
          <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed top-4 right-4 z-50 transform translate-y-[-100%] opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 text-xs font-bold">
      <span id="toast-msg">保存しました</span>
    </div>
  </div>

  <script>
    let currentDate = getTodayString();
    const defaultSettings = { calories: 2000, p: 110, f: 50, c: 275, apiKey: "" };

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }

    function getStorageData() {
      try {
        const raw = localStorage.getItem('nutridaily_data');
        return raw ? JSON.parse(raw) : { days: {}, settings: defaultSettings };
      } catch (e) {
        return { days: {}, settings: defaultSettings };
      }
    }

    function setStorageData(data) { localStorage.setItem('nutridaily_data', JSON.stringify(data)); }
    function getApiKey() { return (getStorageData().settings?.apiKey || "").trim(); }

    function getDayData(dateStr) {
      const data = getStorageData();
      if (!data.days) data.days = {};
      if (!data.days[dateStr]) data.days[dateStr] = { meals: [], water: 0 };
      return data.days[dateStr];
    }

    function saveDayData(dateStr, dayObj) {
      const data = getStorageData();
      if (!data.days) data.days = {};
      data.days[dateStr] = dayObj;
      setStorageData(data);
    }

    function updateUI() {
      const day = getDayData(currentDate);
      const settings = getStorageData().settings || defaultSettings;
      document.getElementById('date-picker-input').value = currentDate;

      let totalCal = 0, totalP = 0, totalF = 0, totalC = 0;
      const subTotals = { breakfast: 0, lunch: 0, dinner: 0, snack: 0 };
      const categories = { breakfast: [], lunch: [], dinner: [], snack: [] };

      (day.meals || []).forEach(meal => {
        const cal = Number(meal.calories) || 0;
        totalCal += cal;
        totalP += (Number(meal.p) || 0);
        totalF += (Number(meal.f) || 0);
        totalC += (Number(meal.c) || 0);
        if (subTotals[meal.category] !== undefined) {
          subTotals[meal.category] += cal;
          categories[meal.category].push(meal);
        }
      });

      document.getElementById('stat-total-calories').innerText = Math.round(totalCal);
      document.getElementById('stat-target-calories').innerText = settings.calories;
      document.getElementById('stat-remaining-calories').innerText = Math.round(settings.calories - totalCal);
      const calPercent = Math.min(100, Math.round((totalCal / settings.calories) * 100));
      document.getElementById('stat-calorie-percent').innerText = `${calPercent}%`;
      document.getElementById('stat-calorie-bar').style.width = `${calPercent}%`;

      document.getElementById('stat-p-val').innerText = totalP.toFixed(1);
      document.getElementById('stat-p-target').innerText = settings.p;
      document.getElementById('stat-p-bar').style.width = `${Math.min(100, (totalP / settings.p) * 100)}%`;

      document.getElementById('stat-f-val').innerText = totalF.toFixed(1);
      document.getElementById('stat-f-target').innerText = settings.f;
      document.getElementById('stat-f-bar').style.width = `${Math.min(100, (totalF / settings.f) * 100)}%`;

      document.getElementById('stat-c-val').innerText = totalC.toFixed(1);
      document.getElementById('stat-c-target').innerText = settings.c;
      document.getElementById('stat-c-bar').style.width = `${Math.min(100, (totalC / settings.c) * 100)}%`;

      document.getElementById('stat-water-val').innerText = day.water || 0;
      document.getElementById('stat-water-bar').style.width = `${Math.min(100, ((day.water || 0) / 2000) * 100)}%`;

      ['breakfast', 'lunch', 'dinner', 'snack'].forEach(cat => {
        document.getElementById(`badge-${cat}-subtotal`).innerText = `(${Math.round(subTotals[cat])} kcal)`;
        const listEl = document.getElementById(`meal-list-${cat}`);
        if (!categories[cat] || categories[cat].length === 0) {
          listEl.innerHTML = `<div class="text-center py-4 text-xs text-slate-400">記録なし</div>`;
        } else {
          listEl.innerHTML = categories[cat].map(m => `
            <div class="px-3 py-2 flex items-center justify-between hover:bg-slate-50 rounded-xl text-xs">
              <div><strong class="text-slate-800">${m.name}</strong><span class="text-[10px] text-slate-400 ml-2">${Math.round(m.calories)} kcal (P:${m.p}g F:${m.f}g C:${m.c}g)</span></div>
              <button onclick="deleteMeal('${m.id}')" class="text-slate-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          `).join('');
        }
      });
    }

    async function triggerAiAutoEstimate() {
      const key = getApiKey();
      const hintEl = document.getElementById('ai-estimate-hint');
      hintEl.classList.remove('hidden');

      if (!key) {
        hintEl.innerHTML = `<span class="text-rose-500 font-bold">⚠️ 右上の「設定」からGemini APIキーを入力してください。</span>`;
        return;
      }

      const dishName = document.getElementById('meal-name-input').value.trim();
      if (!dishName) {
        hintEl.innerHTML = `<span class="text-amber-600">料理名を入力してください。</span>`;
        return;
      }

      hintEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-600"></i> AIが栄養価を計算中...`;

      // 複数のモデルエンドポイントをフォールバック試行
      const modelsToTry = [
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent",
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"
      ];

      const prompt = `料理「${dishName}」の1人前あたりの標準的なエネルギー(kcal)、たんぱく質(g)、脂質(g)、炭水化物(g)を推定し、JSONのみで出力してください。形式: {"calories": 450, "p": 15.2, "f": 10.5, "c": 65.0}`;

      let success = false;
      let lastErrorMessage = "";

      for (const endpoint of modelsToTry) {
        try {
          const res = await fetch(`${endpoint}?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const data = await res.json();
          if (!res.ok) {
            lastErrorMessage = data?.error?.message || `HTTP ${res.status}`;
            continue;
          }

          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawText) {
            const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(cleanJson);
            document.getElementById('meal-cal-input').value = Math.round(parsed.calories || parsed.energy || 0);
            document.getElementById('meal-p-input').value = (parsed.p || parsed.protein || 0).toFixed(1);
            document.getElementById('meal-f-input').value = (parsed.f || parsed.fat || 0).toFixed(1);
            document.getElementById('meal-c-input').value = (parsed.c || parsed.carbs || 0).toFixed(1);
            hintEl.innerHTML = `<span class="text-emerald-600 font-bold">✨ 自動入力完了！</span>`;
            success = true;
            break;
          }
        } catch (err) {
          lastErrorMessage = err.message;
        }
      }

      if (!success) {
        hintEl.innerHTML = `<span class="text-rose-500 font-bold">❌ 推定に失敗しました: ${lastErrorMessage}</span>`;
      }
    }

    function saveMealForm(e) {
      e.preventDefault();
      const day = getDayData(currentDate);
      day.meals.push({
        id: 'meal_' + Date.now(),
        name: document.getElementById('meal-name-input').value.trim(),
        category: document.getElementById('meal-category-val').value,
        calories: Number(document.getElementById('meal-cal-input').value) || 0,
        p: Number(document.getElementById('meal-p-input').value) || 0,
        f: Number(document.getElementById('meal-f-input').value) || 0,
        c: Number(document.getElementById('meal-c-input').value) || 0
      });
      saveDayData(currentDate, day);
      closeMealModal();
      updateUI();
      showToast('食事を保存しました');
    }

    function deleteMeal(id) {
      const day = getDayData(currentDate);
      day.meals = (day.meals || []).filter(m => m.id !== id);
      saveDayData(currentDate, day);
      updateUI();
    }

    function openMealModal(cat = 'lunch') {
      selectMealFormCat(cat);
      document.getElementById('meal-name-input').value = '';
      document.getElementById('meal-cal-input').value = '';
      document.getElementById('meal-p-input').value = '';
      document.getElementById('meal-f-input').value = '';
      document.getElementById('meal-c-input').value = '';
      document.getElementById('ai-estimate-hint').classList.add('hidden');
      document.getElementById('meal-modal').classList.remove('hidden');
    }
    function closeMealModal() { document.getElementById('meal-modal').classList.add('hidden'); }
    function selectMealFormCat(cat) {
      document.getElementById('meal-category-val').value = cat;
      ['breakfast', 'lunch', 'dinner', 'snack'].forEach(c => {
        document.getElementById(`cat-btn-${c}`).className = c === cat ? 'py-1 rounded-lg bg-white text-emerald-700 shadow-xs' : 'py-1 rounded-lg';
      });
    }

    function openSettingsModal() {
      const settings = getStorageData().settings || defaultSettings;
      document.getElementById('set-api-key').value = settings.apiKey || '';
      document.getElementById('set-target-cal').value = settings.calories || 2000;
      document.getElementById('set-target-p').value = settings.p || 110;
      document.getElementById('set-target-f').value = settings.f || 50;
      document.getElementById('set-target-c').value = settings.c || 275;
      document.getElementById('settings-modal').classList.remove('hidden');
    }
    function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }

    function saveTargetSettings(e) {
      e.preventDefault();
      const data = getStorageData();
      data.settings = {
        apiKey: document.getElementById('set-api-key').value.trim(),
        calories: Number(document.getElementById('set-target-cal').value) || 2000,
        p: Number(document.getElementById('set-target-p').value) || 110,
        f: Number(document.getElementById('set-target-f').value) || 50,
        c: Number(document.getElementById('set-target-c').value) || 275
      };
      setStorageData(data);
      closeSettingsModal();
      updateUI();
      showToast('設定を保存しました');
    }

    function addWater(a) { const d = getDayData(currentDate); d.water = (d.water || 0) + a; saveDayData(currentDate, d); updateUI(); }
    function shiftDate(o) { const d = new Date(currentDate); d.setDate(d.getDate() + o); currentDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; updateUI(); }
    function goToToday() { currentDate = getTodayString(); updateUI(); }
    function onDateInputChange(v) { if (v) { currentDate = v; updateUI(); } }
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-[-100%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-[-100%]', 'opacity-0'); }, 2000);
    }

    window.onload = updateUI;
  </script>
</body>
</html>
